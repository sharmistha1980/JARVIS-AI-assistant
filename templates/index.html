<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Forensic Terminal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <h1>SYS.JARVIS // FORENSIC TERMINAL</h1>
            <span id="status-indicator" class="status-active">STATUS: STANDING BY.</span>
        </header>
        
        <div class="data-streams">
            <div id="chat-log" class="chat-box">
                <div class="message system">SYSTEM LOG // INITIALIZATION COMPLETE. LOCAL LLM READY.</div>
            </div>
        </div>
        
        <div class="visualizer">
            <div class="waveform" id="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <div class="input-controls">
            <button id="voice-btn" class="terminal-btn">MIC // [OFF]</button>
            <input type="text" id="text-input" placeholder="Enter command line..." autocomplete="off">
            <button id="send-btn" class="terminal-btn">EXECUTE</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
