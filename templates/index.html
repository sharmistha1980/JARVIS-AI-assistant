<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Core Electric Cyan HUD Styling */
        body {
            background-color: #050505;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            padding: 40px;
            width: 800px;
            text-align: center;
            position: relative;
        }

        h1 {
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .visualizer-circle {
            width: 70px;
            height: 70px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            box-shadow: 0 0 15px #00ffff;
            /* Simple pulsing animation to make it look alive */
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 10px #00ffff; }
            100% { transform: scale(1.05); box-shadow: 0 0 25px #00ffff; }
        }

        /* THIS IS THE CRITICAL BOX FOR TEXT */
        #chat-box {
            border: 1px solid rgba(0, 255, 255, 0.3);
            height: 280px;
            margin: 20px 0 30px 0;
            padding: 20px;
            overflow-y: auto;
            text-align: left;
            background: rgba(0, 20, 20, 0.4);
            font-size: 16px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 12px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>J.A.R.V.I.S. ONLINE</h1>
        
        <div class="visualizer-circle"></div>

        <div id="chat-box">
            <p style="color: rgba(0,255,255,0.5); font-style: italic;">Awaiting initialization sequence...</p>
        </div>

        <div class="btn-container">
            <button onclick="startJarvis()">INITIALIZE</button>
            <button onclick="stopAndProcess()">STOP & PROCESS</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
</body>
</html>
